name: Build TwitchBSR qmod

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Setup Android NDK r27c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Point build at the NDK
        run: |
          echo "${{ steps.ndk.outputs.ndk-path }}" > ndkpath.txt
          cat ndkpath.txt

      - name: Install qpm
        run: |
          mkdir -p qpm_dl
          cd qpm_dl
          gh release download v1.5.11 --repo QuestPackageManager/QPM.CLI --pattern '*' \
            || gh release download --repo QuestPackageManager/QPM.CLI --pattern '*'
          for f in *.zip; do [ -e "$f" ] && unzip -o -q "$f" -d "x_${f%.zip}"; done
          for f in *.tar.gz; do [ -e "$f" ] && mkdir -p "x_${f%.tar.gz}" && tar -xzf "$f" -C "x_${f%.tar.gz}"; done
          cd ..
          FOUND=""
          while IFS= read -r c; do
            chmod +x "$c" 2>/dev/null || true
            if "$c" --version >/dev/null 2>&1; then FOUND="$c"; break; fi
          done < <(find qpm_dl -type f ! -name '*.zip' ! -name '*.tar.gz' ! -name '*.exe' ! -name '*.pdb' ! -name '*.dbg' ! -name '*.dSYM')
          if [ -z "$FOUND" ]; then echo "No runnable qpm binary found:"; find qpm_dl -type f; exit 1; fi
          echo "Using $FOUND"
          sudo install -m 755 "$FOUND" /usr/local/bin/qpm
          qpm --version

      - name: QPM restore
        run: |
          qpm restore --update || qpm restore
          ls extern || true

      - name: Build native library
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24
          cmake --build build -j"$(nproc)"
          ls -la build/*.so

      - name: Package qmod
        run: |
          qpm qmod manifest || true
          qpm qmod zip TwitchBSR.qmod

      - uses: actions/upload-artifact@v4
        with:
          name: TwitchBSR.qmod
          path: TwitchBSR.qmod
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libtwitch-bsr.so
          path: build/libtwitch-bsr.so
          if-no-files-found: ignore
